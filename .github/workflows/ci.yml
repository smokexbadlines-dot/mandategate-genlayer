name: Contract checks

on:
  push:
  pull_request:

jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: genvm-lint check contracts/mandate_gate.py
      - run: python -m pytest -q
